<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Share your screen</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2430; background: #f6f7f9; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px 20px 8px; font-weight: 600; font-size: 16px; }
    h3 { margin: 12px 20px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 20px; }
    main { flex: 1; overflow-y: auto; padding-bottom: 12px; }
    button.src { border: 2px solid transparent; background: #fff; border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    button.src:hover { border-color: #c7cdfa; }
    button.src.sel { border-color: #5b5bd6; }
    button.src img { width: 100%; aspect-ratio: 16/10; object-fit: contain; background: #e5e7eb; border-radius: 6px; display: block; }
    button.src span { display: block; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid #e5e7eb; background: #fff; }
    footer button { padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font: inherit; }
    footer button.primary { background: #5b5bd6; border-color: #5b5bd6; color: #fff; }
    footer button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>Choose what to share</header>
  <main>
    <h3>Entire screen</h3><div class="grid" id="screens"></div>
    <h3>Windows</h3><div class="grid" id="windows"></div>
  </main>
  <footer>
    <button id="cancel">Cancel</button>
    <button id="share" class="primary" disabled>Share</button>
  </footer>
  <script>
    let selected = null;
    const shareBtn = document.getElementById('share');
    document.getElementById('cancel').onclick = () => window.desktop.choose(null);
    shareBtn.onclick = () => window.desktop.choose(selected);

    window.desktop.getSources().then((sources) => {
      for (const s of sources) {
        const b = document.createElement('button');
        b.className = 'src';
        const img = document.createElement('img');
        img.src = s.thumbnail;
        const label = document.createElement('span');
        label.textContent = s.name;
        b.append(img, label);
        b.onclick = () => {
          document.querySelectorAll('.src.sel').forEach((el) => el.classList.remove('sel'));
          b.classList.add('sel');
          selected = s.id;
          shareBtn.disabled = false;
        };
        b.ondblclick = () => window.desktop.choose(s.id);
        document.getElementById(s.isScreen ? 'screens' : 'windows').append(b);
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.desktop.choose(null); });
  </script>
</body>
</html>
